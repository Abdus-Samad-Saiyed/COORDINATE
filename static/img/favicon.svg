<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Obsidian to Deep Emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B14"/>
      <stop offset="100%" stop-color="#040906"/>
    </linearGradient>

    <!-- Neon Emerald Gradient for Nexus Core -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#08B74F"/>
      <stop offset="100%" stop-color="#058C3B"/>
    </linearGradient>

    <!-- Coordinate Kinetic Beam Gradient -->
    <linearGradient id="kineticBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08B74F"/>
      <stop offset="50%" stop-color="#00FFCC"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#08B74F"/>
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08B74F" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#00FFA3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#040906" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame with High-Contrast Emerald Rim -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#bgGrad)" stroke="#08B74F" stroke-width="2.2" stroke-opacity="0.95"/>

  <!-- Radial Core Backlight -->
  <circle cx="32" cy="32" r="24" fill="url(#ambientGlow)"/>

  <!-- Subtle Coordinate Compass Ticks -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#00FFA3" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="3,4"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.22"/>

  <!-- Central Nexus 'N' Monogram -->
  <!-- Left Pillar -->
  <path d="M16 46 L16 18 C16 16.5 17.5 15.5 19 16.5 L24 20 C24.8 20.6 25.5 21.6 25.5 22.8 L25.5 44 C25.5 45.5 24 46.5 22.5 45.8 L17.5 46.5 C16.5 46.8 16 46.5 16 46 Z" fill="url(#emeraldNeon)"/>

  <!-- Dynamic Center Crossbeam (Kinetic Coordinate Vector) -->
  <path d="M19 17.5 L45 46.5 C46.2 47.8 48 47 48 45 L48 39 C48 37.8 47.2 36.8 46.2 35.6 L26 14.5 C24.5 13 22 14.2 22 16.2 L22 17.5 Z" fill="url(#kineticBeam)"/>

  <!-- Right Pillar -->
  <path d="M38.5 20 C38.5 18.5 40 17.5 41.5 18.2 L46.5 20.5 C47.5 21 48 22 48 23.2 L48 46 C48 47.5 46.5 48.5 45 47.8 L40 44.5 C39 43.8 38.5 42.8 38.5 41.6 Z" fill="url(#emeraldNeon)"/>

  <!-- Coordinate Nodes (Interconnected Campus Transit Hubs) -->
  <circle cx="20.5" cy="18.5" r="3.2" fill="url(#nodeGlow)"/>
  <circle cx="43.5" cy="45.5" r="3.2" fill="url(#nodeGlow)"/>
  <circle cx="43.5" cy="22" r="2.5" fill="#00FFA3"/>
  <circle cx="20.5" cy="42" r="2.5" fill="#00E5FF"/>
  <circle cx="32" cy="32" r="2.8" fill="#FFFFFF"/>
</svg>
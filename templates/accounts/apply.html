{% extends 'base.html' %}

{% block content %}

<div
    class="
        row
        justify-content-center
    "
>

    <div class="col-lg-6">

        <div class="glass p-5">

            <h1
                class="
                    fw-bold
                    mb-3
                "
            >

                Apply for
                <span class="green-accent">
                    Verification
                </span>

            </h1>

            <p class="text-secondary mb-4">

                Accounts are manually verified
                using student identification.

            </p>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="
                        btn
                        btn-green
                        w-100
                    "
                >

                    Submit Application

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}

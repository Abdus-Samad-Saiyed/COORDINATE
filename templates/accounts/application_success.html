{% extends 'base.html' %}

{% block content %}

<div
    class="
        row
        justify-content-center
    "
>

    <div class="col-lg-6">

        <div class="glass p-5 text-center">

            <h1
                class="
                    fw-bold
                    green-accent
                    mb-4
                "
            >

                Application Submitted

            </h1>

            <p class="mb-4">

                Your verification request
                has been recorded.

            </p>

            <div
                class="
                    fs-2
                    fw-bold
                    mb-4
                "
            >

                {{ application.application_number }}

            </div>

            <p class="text-secondary">

                Present this application number
                during physical verification.

            </p>

        </div>

    </div>

</div>

{% endblock %}

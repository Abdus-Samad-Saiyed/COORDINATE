{% extends 'base.html' %}
{% load static %}

{% block title %}{{ service.name }} — Campus Nexus Service Unavailable{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass p-5 text-center position-relative overflow-hidden">
                <div class="mb-4">
                    <span class="badge bg-secondary-subtle text-secondary border border-secondary px-3 py-2 rounded-pill fw-semibold">
                        <i class="bi bi-hourglass-split me-1"></i> Coming Soon
                    </span>
                </div>

                <div class="feature-icon mx-auto mb-4" style="width: 72px; height: 72px; font-size: 2rem;">
                    <i class="bi {{ service.icon }}"></i>
                </div>

                <h2 class="fw-bold mb-2">{{ service.name }}</h2>
                <h5 class="text-secondary mb-4">{{ service.tagline }}</h5>

                <p class="text-muted mb-4 max-w-600 mx-auto">
                    {{ service.description }}
                </p>

                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'landing' %}" class="btn btn-outline-green">
                        <i class="bi bi-house-door me-1"></i> Campus Nexus Hub
                    </a>
                    <a href="{% url 'ride_list' %}" class="btn btn-green">
                        <i class="bi bi-car-front me-1"></i> Launch COORDINATE
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

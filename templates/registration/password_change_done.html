{% extends 'base.html' %}

{% block title %}Password Updated — COORDINATE{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 50vh;">
        <div class="col-md-8 col-lg-5">
            <div class="glass p-4 p-md-5 text-center">
                <div class="feature-icon mx-auto mb-3 text-success" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h3 class="fw-bold mb-2">Password Changed Successfully</h3>
                <p class="text-secondary mb-4">
                    Your password has been updated. You can continue using COORDINATE with your new credentials.
                </p>
                <a href="{% url 'dashboard' %}" class="btn btn-green px-4 py-2 fw-bold">
                    <i class="bi bi-speedometer2 me-1"></i> Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
